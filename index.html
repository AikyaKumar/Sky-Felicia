const $=s=>document.querySelector(s),eur=n=>'€'+(Math.round(n*10)/10)+'M';
const INFO={mass:['Mass','Everything you launch weighs something. Rockets can only lift so many kilograms to an orbit, and the further the orbit, the less they can lift. More instruments = more mass.'],

budget:['Budget','Money to build, launch and operate. Bigger rockets and more instruments cost more. Unspent budget is rewarded.'],
data:['Data & communications','Instruments generate data (Gbit/day). Your antenna must send it home. Farther orbits shrink the link, and data that can not be sent is lost science.'],
time:['Time','How long the mission operates. Longer missions cost more to run. Beginners get more time; directors get less.'],
orbit:['Orbits','Low orbits are cheap to reach and give sharp images, but you see only a strip of Earth and the satellite passes through Earth’s shadow (eclipse), so a battery is needed. Geostationary orbit hovers over one spot. Orbits around other worlds need more launcher performance.'],
launcher:['Launch vehicles','Payload capacity is given for low Earth orbit. Reaching the Moon or Mars needs extra speed (delta-v), so the same rocket lifts far less. Pick a rocket that is big enough but not wasteful.'],

fuel:['Propellant','Fuel lets you change trajectory after launch: burn earlier to arrive faster, or coast to save fuel. It adds mass.'],
roles:['Team roles','Mission Planner chooses objective and orbit. Spacecraft Engineer builds the craft. Science Lead picks instruments. Communications Officer sizes the link. Resource Manager watches budget, mass, power.']};

It('b0','batt','No battery',0,0,0,1,{t:'Fine only if never in shadow.'}),It('b1','batt','Battery pack',30,0,4,1,{bt:1,t:'Powers the craft in eclipse.'}),
It('c1','comm','Low-gain antenna',10,20,3,1,{r:2,t:'Sends ~2 Gbit/day from Earth orbit.'}),It('c2','comm','High-gain dish',45,60,10,1,{r:12,t:'~12 Gbit/day, needs 60 W.'}),It('c3','comm','Deep-space dish',90,110,25,2,{r:30,t:'~30 Gbit/day, needs 110 W.'}),
It('u1','cpu','Basic computer',5,10,2,1,{t:'Fine near Earth.'}),It('u2','cpu','Radiation-hard computer',8,15,9,2,{t:'Survives radiation.'}),
It('a1','adcs','Reaction wheels',15,15,4,1,{t:'Points the craft.'}),It('a2','adcs','Wheels + star tracker',25,25,9,2,{pt:1,t:'Sharper pointing: +15% science.'}),
It('h0','health','No health monitor',0,0,0,1,{t:''}),It('h1','health','Health monitor',6,8,3,1,{hm:1,t:'Detects faults early: halves damage.'}),
It('cam','inst','Camera',25,40,12,1,{d:6,s:20,t:'Pictures of the surface.'}),It('spec','inst','Spectrometer',40,60,20,1,{d:4,s:30,t:'Reads chemistry from light.'}),It('mag','inst','Magnetometer',10,8,6,1,{d:1,s:10,t:'Measures magnetic fields.'}),
It('par','inst','Particle detector',30,25,14,2,{d:2,s:18,t:'Counts charged particles.'}),It('rad','inst','Radar',90,150,35,2,{d:10,s:40,t:'Sees through clouds and dust.'}),It('ir','inst','IR sounder',55,80,28,2,{d:8,s:35,t:'Temperature profiles.'})];
const GN={struct:'Structure',power:'Power system',batt:'Battery',comm:'Communications',cpu:'Onboard computer',adcs:'Attitude control',health:'Health monitoring'};
const EV=[{t:'Solar flare',d:'A burst of radiation from the Sun is heading for your spacecraft.',a:['Enter safe mode (lose a month of data)',0,-4,3,'Safe mode protects the electronics: a calm, textbook decision.'],b:['Keep observing',14,6,0,'Bold! You gained data, but radiation hit the craft.']},
{t:'Asteroid field',d:'Tracking shows small rocks crossing your path.',a:['Fire thrusters to dodge',8,0,5,'Dodging cost little fuel and kept most science.'],b:['Stay on course',28,4,0,'You saved fuel, but impacts caused damage. A reinforced frame would help.']}];
const ROLES=['Mission Planner','Spacecraft Engineer','Science Lead','Communications Officer','Resource Manager'];
const CREW=[['Aikya','Mission Commander & Planner'],['Bidur','Systems Engineer'],['Fujai','Science Lead'],['Konouz','Communications & Resources']];

/* ---------- state ---------- */
let DB;try{DB=JSON.parse(localStorage.sg||'')}catch(e){DB=null}DB=DB||{u:{},g:{}};
const sv=()=>{try{localStorage.sg=JSON.stringify(DB)}catch(e){}};
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return''+h};
let ST={scr:'auth',m:[],mode:'login',msg:''},G,D,K,SIM;
const ids=()=>[...D.inst,...Object.values(D.sel)].filter(Boolean).map(i=>IT.find(x=>x.id===i));
const obj=()=>OBJ.find(o=>o.id===D.obj),df=()=>DIFF[D.diff];

function calc(){const L=ids(),o=ORB[D.orbit]||{f:0,sun:1,cf:0,o:0,reach:9},ln=LN.find(l=>l.id===D.ln),ob=obj(),y=df().y;
let r={mass:L.reduce((a,x)=>a+x.m,0)+D.fuel,use:L.reduce((a,x)=>a+x.p,0),gen:0,cost:L.reduce((a,x)=>a+x.c,0)+D.fuel*.02,data:0,rate:0,sci:0};
const pw=L.find(x=>x.g==='power'),cm=L.find(x=>x.g==='comm');if(pw)r.gen=pw.w*(pw.rtg?1:o.sun);
L.filter(x=>x.d).forEach(x=>r.data+=x.d);r.rate=(cm?cm.r:0)*o.cf;r.ratio=r.data?Math.min(1,r.rate/r.data):1;
const pt=L.some(x=>x.pt)?1.15:1;L.filter(x=>x.s).forEach(x=>r.sci+=x.s*(ob&&ob.good.includes(x.id)?1:.3));r.sci*=r.ratio*pt;
r.cap=ln?ln.cap*o.f:0;r.lc=ln?ln.c:0;r.ops=y*o.o;r.total=r.cost+r.lc+r.ops;r.hm=L.some(x=>x.hm);r.rf=L.some(x=>x.rf);r.bt=L.some(x=>x.bt);r.ln=ln;r.orb=o;r.L=L;return r}
function checks(){const r=calc(),ob=obj(),d=df(),c=[];
c.push([ob.orbs.includes(D.orbit),'Orbit matches objective','The objective “'+ob.n+'” needs '+ob.orbs.map(x=>ORB[x].n).join(' or ')+'.']);
c.push([r.ln&&r.ln.reach>=r.orb.reach,'Launcher can reach this orbit','This rocket cannot give enough speed to reach '+r.orb.n+'.']);
c.push([r.mass<=r.cap,'Mass fits the rocket ('+Math.round(r.mass)+' / '+Math.round(r.cap)+' kg)','Spacecraft is too heavy for this rocket to this orbit. Remove parts, fuel, or pick a stronger rocket.']);
c.push([r.use<=r.gen,'Power balance ('+Math.round(r.use)+' W used / '+Math.round(r.gen)+' W made)','Not enough power at this distance from the Sun. Add bigger arrays, an RTG, or drop instruments.']);
if(D.diff!=='easy'&&D.diff!=='sand')c.push([!r.orb.ecl||r.bt,'Eclipse protection','This orbit passes through shadow: add a battery.']);
c.push([D.diff==='sand'||r.total<=d.b,'Within budget ('+eur(r.total)+' / '+eur(d.b)+')','You are over budget by '+eur(r.total-d.b)+'.']);
c.push([r.ratio>=d.thr,'Data can be sent home ('+Math.round(r.ratio*100)+'%)','Your instruments make more data than the antenna can send. Use a stronger antenna or fewer instruments.']);
if(D.diff==='hard')c.push([D.inst.length<=4,'At most 4 instruments','Director level allows 4 instruments.']);
c.push([!!D.inst.length,'At least one instrument','A mission without instruments has no science.']);return c}
function feas(o){const d=df(),cheap=LN.filter(l=>l.reach>=o.reach).sort((a,b)=>a.c-b.c)[0],R=[];
if(!cheap)R.push('No available rocket can reach '+o.dest+'.');else if(d.b<cheap.c+50)R.push('The cheapest capable rocket ('+cheap.n+', '+eur(cheap.c)+') plus a basic spacecraft costs more than your budget of '+eur(d.b)+'.');
if(o.id==='jup'&&D.diff!=='sand')R.push('Sunlight at Jupiter is only 4% of Earth’s: you would need an RTG and a deep-space antenna.');return R}

/* ---------- screens ---------- */
function render(){const a=$('#app');a.innerHTML=({auth,hub,mission,sim,report,learn}[ST.scr])();if(ST.scr==='sim')startAnim()}
function head(){return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h1>✦ FELICIA</h1><div class="dim">${NET.on?'🌐 Room <b>'+NET.code+'</b> · '+NET.ro.map((n,i)=>esc(n)+' ('+(ROLES[i]||'Crew')+')').join(', '):ST.m.join(', ')} · Funds <b class="ok">${eur(G.euro)}</b> <button class="s" onclick="ST.scr='hub';render()">Menu</button></div></div>`}
function auth(){return`<h1 style="text-align:center;font-size:15px;letter-spacing:6px;color:#9aa7d6;margin-top:18px">FELICIA</h1><h2 style="text-align:center;font:clamp(30px,5.5vw,60px)/1.15 Georgia,serif;margin:6px 0 26px;text-shadow:0 2px 18px #000">Design it. Launch it.<br>Explore it together.</h2><div class="g"><div class="card"><h3>${ST.mode==='login'?'Log in':'Create your Sky Felicia account'}</h3>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><p class="bad">${ST.msg}</p>
<button onclick="doAuth()">${ST.mode==='login'?(ST.m.length?'Add teammate':'Log in'):'Create account'}</button>
<button class="s" onclick="ST.mode=ST.mode==='login'?'new':'login';ST.msg='';render()">${ST.mode==='login'?'New here? Create account':'I have an account'}</button>
<p class="dim">Accounts are saved in this browser only. Each team (1–4 players) keeps its own saved game.</p></div>
<div class="card"><h3>Your team (${ST.m.length}/4) ${ib('roles')}</h3>${ST.m.map(x=>'<p>👩‍🚀 '+x+'</p>').join('')||'<p class="dim">Log in to add players. Log in as several people to play together.</p>'}
<button ${ST.m.length?'':'disabled'} onclick="startGame()">Start / continue game ▶</button></div></div>`}
function doAuth(){const u=$('#u').value.trim(),p=$('#p').value;if(!u||!p){ST.msg='Enter username and password.';return render()}
if(ST.mode==='new'){if(DB.u[u]){ST.msg='That name is taken.';return render()}DB.u[u]=hs(p);ST.mode='login'}
else if(DB.u[u]!==hs(p)){ST.msg='Wrong username or password.';return render()}
if(ST.m.includes(u)){ST.msg='Already in the team.';return render()}if(ST.m.length>=4){ST.msg='Team is full.';return render()}
ST.m.push(u);ST.msg='';sv();render()}
function startGame(){K=[...ST.m].sort().join('+');G=DB.g[K]=DB.g[K]||{euro:50,draft:null,missions:[],hp:{}};D=G.draft;ST.scr='hub';sv();render()}
function hub(){const lb=[];Object.entries(DB.g).forEach(([k,g])=>g.missions.forEach(m=>lb.push({k,...m})));lb.sort((a,b)=>b.score-a.score);
return head()+`<div class="g"><div class="card"><h3>Start a new mission</h3>${Object.entries(DIFF).map(([k,v])=>`<button style="margin:3px" onclick="newM('${k}')">${v.n}</button>`).join('')}
<p class="dim">Cadet: simple parts and lots of time. Director: more parts, tighter limits, random events. Sandbox: no budget limit.</p>${G.draft?'<button onclick="D=G.draft;ST.scr=\'mission\';D.step=D.step||0;render()">▶ Continue saved mission</button>':''}
<p><button class="s" onclick="ST.scr='learn';render()">📘 Learn space basics</button> <button class="s" onclick="imp()">Import shared design</button></p></div>
<div class="card"><h3>Crew health</h3>${crew().map(c=>`<p>${c[0]} – ${c[1]}<div class="bar"><i style="width:${(G.hp[c[0]]??100)}%"></i></div></p>`).join('')}</div></div>
${NET.on?`<div class="card"><h3>🌐 Online room <b class="ok">${NET.code}</b></h3><p>Share this code with your teammates. Players (${NET.ro.length}/4): ${NET.ro.map(esc).join(', ')}</p><p>You are the <b>${ROLES[NET.ro.indexOf(ST.m[0])]||'Crew member'}</b>. Everyone sees the same screen: build, launch and decide together, and use the chat box.</p><button class="s" onclick="netLeave()">Leave room</button></div>`:`<div class="card"><h3>🌐 Play together on different computers</h3><button onclick="netHost()">Create a room</button> <input id="rc" placeholder="Room code" maxlength="4" style="width:120px;text-transform:uppercase"> <button class="s" onclick="netJoin()">Join</button><p class="dim">One player creates a room and shares the 4-letter code. Everyone logs in with their own account on their own computer.</p><p class="bad">${NET.note||''}</p></div>`}<div class="card"><h3>🏆 Leaderboard</h3>${lb.slice(0,8).map((m,i)=>`<p>${i+1}. ${m.k} – ${m.obj} (${m.diff}) – ${eur(m.score)} ${m.ok?'✅':'❌'}</p>`).join('')||'<p class="dim">No missions yet.</p>'}</div>`}
function crew(){const n=[...ST.m];CREW.forEach(c=>{if(n.length<4&&!n.includes(c[0]))n.push(c[0])});return n.slice(0,4).map((x,i)=>[x,(CREW.find(c=>c[0]===x)||[0,ROLES[i]])[1]])}
function newM(k){D=G.draft={diff:k,obj:null,sel:{struct:'s1',power:'p1',batt:'b0',comm:'c1',cpu:'u1',adcs:'a1',health:'h0'},inst:[],fuel:100,orbit:null,ln:null,step:0};sv();ST.scr='mission';render()}
const STEPS=['1 Objective','2 Spacecraft','3 Orbit & rocket','4 Launch check'];
function dash(){const r=calc(),d=df(),has=D.ln&&D.orbit,sand=d.b>9e3,
b=(v,m,l,k,t)=>`<p>${l} ${ib(k)}<div class="bar"><i class="${m&&v>m?'bad':''}" style="width:${m?Math.min(100,v/m*100):0}%"></i></div><span class="dim">${t}</span></p>`;
return`<div class="card"><h3>Mission dashboard</h3>
${b(r.mass,has?r.cap:0,'Mass','mass',has?`${Math.round(r.mass)} kg of ${Math.round(r.cap)} kg that the rocket can carry to this orbit`:`${Math.round(r.mass)} kg so far (the limit appears after you choose an orbit and a rocket in step 3)`)}
${b(r.use,Math.max(r.gen,1e-9),'Power','power',`${Math.round(r.use)} W used of ${Math.round(r.gen)} W produced${D.orbit?'':' (measured at Earth distance)'}`)}
${b(r.total,sand?0:d.b,'Budget','budget',sand?`${eur(r.total)} (no limit in Sandbox)`:`${eur(r.total)} of ${eur(d.b)}${D.ln&&D.orbit?'':' (rocket and operations are added after step 3)'}`)}
${b(r.data,D.orbit?Math.max(r.rate,1e-9):0,'Data','data',D.orbit?`${Math.round(r.data*10)/10} Gbit/day made · ${Math.round(r.rate*10)/10} Gbit/day can be sent home`:`${Math.round(r.data*10)/10} Gbit/day made (how much can be sent home depends on the orbit)`)}
<p>Time ${ib('time')}: ${d.y} years of operation (speeded up during the simulation)</p>${svg(r)}</div>`}
function svg(r){const g=r.L,pw=Math.min(60,r.gen/14+8);return`<svg viewBox="0 0 240 120" style="width:100%"><rect x="95" y="40" width="50" height="40" rx="6" fill="#8aa0ff" onclick="tip('Structure: '+${JSON.stringify(g.find(x=>x.g==='struct')?.t||'')})"/><rect x="${95-pw}" y="52" width="${pw-5}" height="16" fill="#3a6df0" onclick="tip('Solar arrays make power')"/><rect x="150" y="52" width="${pw-5}" height="16" fill="#3a6df0" onclick="tip('Solar arrays make power')"/>
${g.some(x=>x.r>2)?'<circle cx="120" cy="30" r="14" fill="none" stroke="#fff" onclick="tip(\'High-gain dish: faster data link\')"/>':''}${g.filter(x=>x.d).map((x,i)=>`<circle cx="${105+i*14}" cy="95" r="6" fill="#6fe3a0" onclick="tip('${x.n}: ${x.t}')"/>`).join('')}${r.bt?'<rect x="104" y="58" width="12" height="10" fill="#ffd166"/>':''}</svg><div id="tip" class="dim">Tap parts to learn about them.</div>`}
function tip(t){$('#tip').textContent=t}
function nav(){return`<div class="steps">${STEPS.map((s,i)=>`<button class="${D.step===i?'on':'s'}" onclick="D.step=${i};sv();render()">${s}</button>`).join('')}</div>`}
function mission(){if(!D)return hub();const s=D.step,d=df();let h=head()+nav()+`<p><b>${d.n}</b></p>`;
if(s===0){h+=`<h3>Choose your mission objective first</h3><div class="g">${OBJ.filter(o=>o.lv<=d.l).map(o=>{const f=feas(o);return`<div class="opt ${D.obj===o.id?'on':''} ${f.length?'no':''}" onclick="D.obj='${o.id}';D.orbit=null;sv();render()"><b>${o.n}</b><br><span class="dim">Destination: ${o.dest}. Reward ${eur(o.rew)}</span><br><span class="dim">${o.fact}</span>${f.length?'<p class="bad">⚠ Cannot be achieved: '+f.join(' ')+' Pick another objective.</p>':'<p class="ok">Achievable</p>'}<span class="dim">Minimum: science ≥ ${o.need}. Bonus: science ≥ ${Math.round(o.need*1.6)}.</span></div>`}).join('')}</div>`;
h+=`<button ${D.obj?'':'disabled'} onclick="D.step=1;sv();render()">Next: build spacecraft ▶</button>`}
if(s===1){h+=`<div class="g"><div>`+Object.keys(GN).filter(g=>g!=='health'||d.l>1||1).map(g=>{const l=IT.filter(x=>x.g===g&&x.l<=d.l);if(l.length<2)return'';return`<div class="card"><b>${GN[g]}</b><div class="g">${l.map(x=>`<div class="opt ${D.sel[g]===x.id?'on':''}" onclick="D.sel['${g}']='${x.id}';sv();render()"><b>${x.n}</b><br><span class="dim">${x.m} kg · ${x.p} W · ${eur(x.c)}<br>${x.t}</span></div>`).join('')}</div></div>`}).join('')+
`<div class="card"><b>Instruments</b> <span class="dim">(more science, but more mass, power, cost and data)</span><div class="g">${IT.filter(x=>x.g==='inst'&&x.l<=d.l).map(x=>`<div class="opt ${D.inst.includes(x.id)?'on':''}" onclick="tg('${x.id}')"><b>${x.n}</b>${obj()&&obj().good.includes(x.id)?' ⭐':''}<br><span class="dim">${x.m} kg · ${x.p} W · ${eur(x.c)} · ${x.d} Gbit/d · science ${x.s}<br>${x.t}</span></div>`).join('')}</div><p class="dim">⭐ = especially useful for your objective.</p></div>
<div class="card"><b>Propellant ${ib('fuel')}: ${D.fuel} kg</b><input type="range" min="0" max="300" step="25" value="${D.fuel}" onchange="D.fuel=+this.value;sv();render()"></div></div>${dash()}</div><button onclick="D.step=2;sv();render()">Next: orbit & rocket ▶</button>`}
if(s===2){const ob=obj();h+=`<div class="g"><div><h3>Orbit ${ib('orbit')}</h3><div class="g">${Object.entries(ORB).filter(([k])=>d.l>1||ob.orbs.includes(k)||['leo','geo','llo'].includes(k)).map(([k,o])=>`<div class="opt ${D.orbit===k?'on':''}" onclick="D.orbit='${k}';sv();render()"><b>${o.n}</b> <span class="dim">${o.alt}</span><br><span class="dim">${o.t}<br>Ops ${eur(o.o)}/yr · sunlight ${Math.round(o.sun*100)}% · link ${Math.round(o.cf*100)}%</span></div>`).join('')}</div>
<h3>Rocket ${ib('launcher')}</h3><div class="g">${LN.filter(l=>d.l>1||l.id!=='s').map(l=>`<div class="opt ${D.ln===l.id?'on':''}" onclick="D.ln='${l.id}';sv();render()"><b>${l.n}</b><br><span class="dim">${l.cap} kg to LEO · ${eur(l.c)}${D.orbit?'<br>To your orbit: '+Math.round(l.cap*ORB[D.orbit].f)+' kg':''}</span></div>`).join('')}</div></div>${dash()}</div><button onclick="D.step=3;sv();render()">Next: launch approval ▶</button>`}
if(s===3){const c=checks(),ok=c.every(x=>x[0]);h+=`<div class="card"><h3>Final launch approval</h3>${c.map(x=>`<p class="${x[0]?'ok':'bad'}">${x[0]?'✔':'✘'} ${x[0]?x[1]:x[1]+' – '+x[2]}</p>`).join('')}${ok?'<h3 class="ok">Approved for launch!</h3>':'<p>Go back, modify the design and check again.</p>'}
<button ${ok?'':'disabled'} onclick="launch()">🚀 Launch</button> <button class="s" onclick="share()">Share design</button></div>${dash()}`}
return h}
function tg(i){const k=D.inst.indexOf(i);k<0?D.inst.push(i):D.inst.splice(k,1);sv();render()}
function share(){prompt('Copy this design code to share it:',btoa(JSON.stringify(D)))}
function imp(){const c=prompt('Paste a design code:');try{D=G.draft=JSON.parse(atob(c));D.step=3;ST.scr='mission';sv();render()}catch(e){alert('Invalid code')}}

/* ---------- simulation ---------- */
function launch(){const r=calc();SIM={id:Date.now(),ph:0,dmg:0,mult:1,bonus:[],log:[],r,eva:0,t:0,curv:1,cur:1,base:0,t0:0,rem:DAYS[D.orbit],ops:0,fuel:D.fuel,fx:null};ST.scr='sim';render()}
const chat=(l)=>`<div class="chat">${l.map(x=>`<p><b>${x[0]}:</b> ${x[1]}</p>`).join('')}</div>`;
function sim(){const S=SIM,d=df(),n=crew(),team=ST.m.length>1;let h=head()+`<div class="card"><h3>Mission control – ${obj().n}</h3><canvas id="tc" width="900" height="300" style="width:100%;border-radius:10px;background:rgba(0,0,0,.35)"></canvas><div id="hud" class="dim"></div><p>Spacecraft damage: ${Math.round(S.dmg)}%<div class="bar"><i class="${S.dmg>40?'bad':''}" style="width:${S.dmg}%"></i></div></p>`;
if(S.ph===0)h+=`<p>🚀 Liftoff on ${S.r.ln.n}! Mass ${Math.round(S.r.mass)} kg into ${S.r.orb.n}.</p><button onclick="SIM.ph=1;render()">Continue to mid-course ▶</button>`;
if(S.ph===1){const can=D.fuel>=100;h+=`<h3>Mid-course decision ${ib('fuel')}</h3><p class="dim">On the map, your current route is the grey dashed line. The green dashed line is the shorter route a burn would give you.</p>`;
if(team){const t=[[n[0][0],'Planning here: a short burn could bring us to target sooner and add science time.'],[n[1][0],'Systems here: burning uses 100 kg fuel. I want a margin kept for safety.'],[n[2][0],'Science here: earlier arrival means more data. I vote burn!'],[n[3][0],'Comms here: more data needs the dish at full power. I need the power margin protected.'],[n[0][0],'Compromise: a half-length burn, the dish stays on schedule, we keep 50 kg reserve.'],[n[1][0],'Agreed. Systems approves.'],[n[2][0],'Great, science wins too!'],[n[3][0],'Comms approved. Everyone happy 🎉']];
h+=`<div id="cc" class="chat"></div><button id="ap" disabled onclick="SIM.curv=.6;SIM.fuel=Math.max(0,SIM.fuel-50);decide(.88);SIM.mult*=1.12;SIM.bonus.push(['Team coordination: a negotiated compromise',8]);SIM.ph=2;render()">Approve team plan</button>`;let i=0;setTimeout(function f(){const c=$('#cc');if(!c||i>=t.length){const b=$('#ap');if(b)b.disabled=false;return}c.innerHTML+=`<p><b>${t[i][0]}:</b> ${t[i][1]}</p>`;i++;setTimeout(f,900)},200)}
else h+=`<button ${can?'':'disabled'} onclick="SIM.curv=.35;SIM.fuel-=100;decide(.8);SIM.mult*=1.15;SIM.bonus.push(['Burn for faster arrival',6]);SIM.ph=2;render()">Burn 100 kg: arrive in ${Math.round(eta(S)*.8)} more days (+15% science)</button> <button onclick="SIM.bonus.push(['Saved propellant by coasting',4]);SIM.ph=2;render()">Coast: save fuel, arrive in ${Math.round(eta(S))} more days</button>${can?'':'<p class="dim">Burn needs ≥100 kg propellant: you planned '+D.fuel+' kg.</p>'}`}
if(S.ph===2){const e=EV[d.ev>0?(S.ei||0):0];if(!d.ev){S.ph=3;return sim()}h+=`<h3>⚠ ${e.t}</h3><p>${e.d}</p>`+[e.a,e.b].map((o,i)=>`<button class="s" style="margin:3px" onclick="ev(${i})">${o[0]}</button>`).join('');if(S.fb)h+=`<p class="ok">${S.fb}</p>`}
if(S.ph===3){if(S.dmg>=25&&S.eva<3)h+=`<h3>🧑‍🚀 Spacewalk repair needed</h3><p>Tighten ${3-S.eva} bolt(s) on the damaged panel, then return inside. Each trip drains crew health.</p><button onclick="eva()">Tighten bolt (${S.eva}/3)</button>`;
else h+=`${S.opsDone?'<p class="ok">Science operations complete: all data collected.</p><button onclick="finish()">Finish mission & see report ▶</button>':'<p>All systems stable. Science operations are running. Time is speeded up: '+d.y+' years pass in about 12 seconds.</p>'}`}
return h+'</div>'}
